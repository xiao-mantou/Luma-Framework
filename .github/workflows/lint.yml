name: cpp-linter

# Automatic linting is disabled for this fork. Run it by hand from the Actions tab
# ("Run workflow") when a format check is actually wanted.
on:
  workflow_dispatch:

jobs:
  cpp-linter:
    name: Run linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: cpp-linter/cpp-linter-action@main
        id: linter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file
          tidy-checks: '-*' # clang-tidy has no compile database here, so it only reports noise
          files-changed-only: true # should be set to true initially, but false for testing
          thread-comments: false
          ignore: 'Source/External/** | **/safetyhook* | **/Zydis*'
      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1